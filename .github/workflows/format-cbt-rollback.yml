name: Temporary CBT rollback lint formatting v2
on:
  push:
    branches:
      - feature/makeup-bank-sampling-result-rollback-20261027
    paths:
      - .github/workflows/format-cbt-rollback.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/makeup-bank-sampling-result-rollback-20261027
      - uses: astral-sh/setup-uv@v5
      - name: Ruff fix and format touched backend modules
        run: |
          files=(
            backend/app/domains/attempts/service.py
            backend/app/domains/candidates/makeup_review_repository.py
            backend/app/domains/candidates/makeup_review_service.py
            backend/app/domains/candidates/schemas.py
            backend/app/domains/results/models.py
            backend/app/domains/results/schemas.py
            backend/app/domains/results/service.py
            backend/app/domains/results/rollback_schemas.py
            backend/app/domains/results/rollback_service.py
            backend/app/domains/results/router.py
            backend/app/integrations/weave/results.py
            backend/app/workers/worker.py
            backend/app/workers/maintenance.py
            backend/alembic/versions/20261027_result_rollback.py
            backend/tests/test_makeup_bank_sampling_contract.py
            backend/tests/test_makeup_review.py
            backend/tests/test_result_rollback_contract.py
          )
          uvx ruff@0.16.2 check --fix "${files[@]}"
          uvx ruff@0.16.2 format "${files[@]}"
      - name: Commit reformatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          if ! git diff --cached --quiet; then
            git commit -m "style(cbt): apply Ruff to rollback and makeup changes"
            git push origin HEAD:feature/makeup-bank-sampling-result-rollback-20261027
          fi
