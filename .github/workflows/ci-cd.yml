name: WEAVE CBT image

on:
  push:
    branches: [staging, master]
  pull_request:
    branches: [staging, master]
  workflow_dispatch:
    inputs:
      approve_production:
        description: "Explicitly approve a Production release from master"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cbt-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Identify affected components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      gui: ${{ steps.filter.outputs.gui }}
      image: ${{ steps.filter.outputs.image }}
      release: ${{ steps.filter.outputs.release }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deployment/docker/**'
              - '.github/workflows/backend-validation.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-validation.yml'
            cli:
              - 'deployment/cli/**'
              - 'deployment/bootstrap/**'
              - 'deployment/distribution/**'
              - 'deployment/pyproject.toml'
              - 'deployment/uv.lock'
              - '.github/workflows/deployment-*'
            gui:
              - 'deployment/gui/**'
              - 'deployment/packaging/**'
              - '.github/workflows/ci-cd.yml'
            image:
              - 'backend/**'
              - 'frontend/**'
              - 'deployment/docker/**'
              - 'deployment/compose.yaml'
              - 'deployment/nginx/**'
              - 'deployment/ci-mirrors.yaml'
              - '.github/workflows/ci-cd.yml'
            workflow:
              - '.github/workflows/**'
            release:
              - 'backend/**'
              - 'frontend/**'
              - 'deployment/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/deployment-**'
      - name: Validate YAML structure and duplicate keys
        if: steps.filter.outputs.workflow == 'true'
        shell: bash
        run: |
          python -m pip install 'ruamel.yaml>=0.18,<0.19'
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML
          yaml = YAML(typ='safe')
          for workflow in Path('.github/workflows').glob('*.yml'):
              with workflow.open(encoding='utf-8') as stream:
                  yaml.load(stream)
              print(f'Validated YAML: {workflow}')
          PY

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/backend-validation.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/frontend-validation.yml

  gui-validation:
    name: Desktop unit and headless smoke tests
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.gui == 'true') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate desktop manager discovery
        run: python -m unittest discover -s deployment/gui/tests -v
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install Qt desktop runtime
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Check native GUI creation without display
        env:
          QT_QPA_PLATFORM: offscreen
        run: python deployment/gui/main.py --smoke-test

  bootstrap:
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.cli == 'true') ||
      github.event_name == 'workflow_dispatch'
    name: CLI and bootstrap validation
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run CLI tests
        run: uv run --project deployment python -m unittest discover -s deployment/cli/tests -v
      - name: Check Linux bootstrap syntax
        if: runner.os == 'Linux'
        run: bash -n deployment/bootstrap/linux/bootstrap.sh
      - name: Check PowerShell syntax and state tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path deployment/bootstrap/windows/bootstrap.ps1).Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw 'Windows WSL bootstrap syntax errors.' }
          .\deployment\cli\tests\test_windows_wsl_features.ps1
          .\deployment\cli\tests\test_windows_bootstrap_state.ps1
          .\deployment\cli\tests\test_windows_wsl_version.ps1
          .\deployment\cli\tests\test_windows_native_commands.ps1
          .\deployment\cli\tests\test_windows_wsl_pipes.ps1

  image:
    name: Resolve and verify application image
    needs: [changes, backend, frontend, bootstrap, gui-validation]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'workflow_dispatch' || inputs.approve_production == true) &&
      (needs.changes.outputs.release == 'true' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    outputs:
      image: ${{ steps.digest.outputs.image || steps.reuse.outputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build current application image
        if: (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/app/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cbt-app
          cache-to: type=gha,mode=max,scope=cbt-app
      - name: Verify fresh bootstrap and browser routes
        if: (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
        run: |
          cat > deployment/ci.env <<'EOF'
          ENVIRONMENT=stg
          WEAVE_API_BASE_URL=https://example.test
          POSTGRES_DB=weave_cbt
          POSTGRES_USER=weave
          POSTGRES_PASSWORD=CI-only-credential-2026
          DATABASE_URL=postgresql+asyncpg://weave:CI-only-credential-2026@postgres:5432/weave_cbt
          REDIS_URL=redis://redis:6379/0
          DEBUG=false
          EOF
          printf 'WEAVE_IMAGE=%s\n' "$IMAGE" >> deployment/ci.env
          docker compose -p weave-cbt-ci -f deployment/compose.yaml -f deployment/ci-mirrors.yaml --env-file deployment/ci.env up -d --wait --wait-timeout 240
          for route in staff student; do
            curl --fail --retry 20 --retry-delay 3 --retry-all-errors "http://localhost/$route" -o "/tmp/$route.html"
            grep -q '<html' "/tmp/$route.html"
          done
          curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost/openapi.json -o /tmp/openapi.json
          python3 -c 'import json; assert json.load(open("/tmp/openapi.json"))["paths"]'
      - name: Container diagnostics
        if: failure() && (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          if [ -f deployment/ci.env ]; then
            docker compose -p weave-cbt-ci -f deployment/compose.yaml --env-file deployment/ci.env logs --no-color --tail 100
          fi
      - name: Stop smoke-test services
        if: always() && (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          if [ -f deployment/ci.env ]; then
            docker compose -p weave-cbt-ci -f deployment/compose.yaml --env-file deployment/ci.env down --volumes
          fi
      - name: Log in to GitHub Container Registry
        if: (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ steps.repository.outputs.name }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          printf 'Published image: `%s:sha-%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve published Docker image digest
        id: digest
        if: (needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE: ${{ steps.repository.outputs.name }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          test -n "$DIGEST"
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Resolve existing verified channel image when application is unchanged
        id: reuse
        if: needs.changes.outputs.image != 'true' && github.event_name != 'workflow_dispatch'
        env:
          IMAGE: ${{ steps.repository.outputs.name }}
          CHANNEL: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          # A previously published channel image is used only if no application
          # paths changed; never rely on an embedded emergency/stale digest.
          digest=$(docker buildx imagetools inspect "$IMAGE:$CHANNEL" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Reused validated image for unchanged application: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Require anonymous GHCR access for zero-login manager installations
        env:
          PUBLISHED_IMAGE: ${{ steps.digest.outputs.image || steps.reuse.outputs.image }}
        run: |
          set -Eeuo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$PUBLISHED_IMAGE" >/dev/null; then
            echo "::error::GHCR image is not anonymously pullable. Official manager installers do not require Docker login; make the GitHub Container Registry package public before release."
            exit 1
          fi
          echo "Verified anonymous GHCR image access: $PUBLISHED_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  compile-cli:
    name: Compile standalone CLI (${{ matrix.os }})
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.release == 'true' &&
       (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' && inputs.approve_production == true)
    needs: [changes]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse verified compiled CLI when sources are unchanged
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: build/cli
          key: cbt-cli-v2-${{ runner.os }}-${{ hashFiles('deployment/cli/**/*.py', 'deployment/pyproject.toml', 'deployment/uv.lock') }}
      - name: Install manager compiler
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: python -m pip install -e ./deployment nuitka zstandard
      - name: Compile Windows CLI
        if: runner.os == 'Windows' && steps.cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m nuitka --mode=onefile --assume-yes-for-downloads --output-dir=build/cli --output-filename=weave.exe deployment/cli/entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI compilation failed.' }
          & (Resolve-Path build/cli/weave.exe).Path --help
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Windows CLI did not start.' }
      - name: Compile Linux CLI
        if: runner.os == 'Linux' && steps.cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m nuitka --mode=onefile --assume-yes-for-downloads --output-dir=build/cli --output-filename=weave deployment/cli/entrypoint.py
          build/cli/weave --help
      - name: Validate cached or freshly compiled CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            build/cli/weave.exe --help
          else
            chmod +x build/cli/weave
            build/cli/weave --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-cli-${{ runner.os }}
          path: build/cli/weave*
          if-no-files-found: error

  compile-gui:
    name: Compile desktop GUI (${{ matrix.os }})
    needs: [changes]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.release == 'true' &&
       (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' && inputs.approve_production == true)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache compiled desktop executable
        id: cache-gui
        uses: actions/cache@v4
        with:
          path: build/gui
          key: cbt-gui-v3-${{ runner.os }}-${{ hashFiles('deployment/gui/**', 'deployment/packaging/**') }}
      - name: Install desktop build dependencies
        if: steps.cache-gui.outputs.cache-hit != 'true'
        run: python -m pip install 'PySide6>=6.7,<7' nuitka zstandard
      - name: Compile Windows GUI
        if: runner.os == 'Windows' && steps.cache-gui.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m nuitka --mode=onefile --enable-plugin=pyside6 --windows-console-mode=disable --assume-yes-for-downloads --include-data-dir=deployment/gui/resources=resources --output-dir=build/gui --output-filename=WEAVE-CBT-Desktop.exe deployment/gui/main.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI compilation failed' }
      - name: Install Linux Qt build libraries
        if: runner.os == 'Linux' && steps.cache-gui.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0
      - name: Compile Linux GUI
        if: runner.os == 'Linux' && steps.cache-gui.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m nuitka --mode=onefile --enable-plugin=pyside6 --assume-yes-for-downloads --include-data-dir=deployment/gui/resources=resources --output-dir=build/gui --output-filename=weave-cbt-desktop deployment/gui/main.py
      - name: Smoke test compiled GUI
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            build/gui/WEAVE-CBT-Desktop.exe --smoke-test
          else
            chmod +x build/gui/weave-cbt-desktop
            build/gui/weave-cbt-desktop --smoke-test
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-gui-${{ runner.os }}
          path: |
            build/gui/WEAVE-CBT-Desktop.exe
            build/gui/weave-cbt-desktop
          if-no-files-found: error

  package:
    name: Package manager for ${{ matrix.os }}
    needs: [image, compile-cli, compile-gui]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: compiled-cli-${{ runner.os }}
          path: build/cli
      - uses: actions/download-artifact@v4
        with:
          name: compiled-gui-${{ runner.os }}
          path: build/gui
      - name: Install Windows setup compiler
        if: runner.os == 'Windows'
        run: python -m pip install -e ./deployment nuitka zstandard
      - name: Windows console setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CBT_IMAGE: ${{ needs.image.outputs.image }}
          CHANNEL: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        run: |
          New-Item -ItemType Directory -Force -Path build\payload\assets,dist | Out-Null
          Copy-Item build\cli\weave.exe build\payload\weave.exe
          Copy-Item deployment\compose.yaml build\payload\assets\compose.yaml
          Copy-Item deployment\nginx build\payload\assets\nginx -Recurse
          Copy-Item deployment\bootstrap build\payload\assets\bootstrap -Recurse
          python deployment\distribution\make_manifest.py --channel $env:CHANNEL --image $env:CBT_IMAGE --version "1.0.$env:GITHUB_RUN_NUMBER" --destination build\payload\assets\release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw "Manifest generation failed." }
          $name = if ($env:CHANNEL -eq 'staging') { 'WEAVE-CBT-Staging-Setup.exe' } else { 'WEAVE-CBT-Setup.exe' }
          & (Resolve-Path "build\payload\weave.exe").Path release
          if ($LASTEXITCODE -ne 0) { throw "Bundled CLI cannot resolve Windows release assets." }
          Compress-Archive -Path build\payload\* -DestinationPath build\payload.zip -Force
          python -m nuitka --mode=onefile --assume-yes-for-downloads --include-data-files=build/payload.zip=payload.zip --output-dir=dist --output-filename=$name deployment\distribution\windows\setup.py
          if ($LASTEXITCODE -ne 0) { throw "Windows setup build failed." }
          & (Join-Path (Resolve-Path dist).Path $name) --verify-payload
          if ($LASTEXITCODE -ne 0) { throw "Compiled Windows setup payload verification failed." }
      - name: Windows graphical desktop setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item build\gui\WEAVE-CBT-Desktop.exe build\payload\WEAVE-CBT-Desktop.exe
          Compress-Archive -Path build\payload\* -DestinationPath build\desktop-payload.zip -Force
          $name = if ('${{ github.ref_name }}' -eq 'staging') { 'WEAVE-CBT-Staging-Desktop-Setup.exe' } else { 'WEAVE-CBT-Desktop-Setup.exe' }
          python -m nuitka --mode=onefile --windows-console-mode=disable --assume-yes-for-downloads --include-data-files=build/desktop-payload.zip=payload.zip --output-dir=build/desktop-installer --output-filename=$name deployment/packaging/windows/desktop_setup.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI setup compilation failed' }
          Copy-Item (Join-Path build\desktop-installer $name) dist\
          & (Join-Path (Resolve-Path dist).Path $name) --verify-payload
          if ($LASTEXITCODE -ne 0) { throw 'GUI setup payload verification failed' }
      - name: Linux terminal package
        if: runner.os == 'Linux'
        shell: bash
        env:
          CBT_IMAGE: ${{ needs.image.outputs.image }}
          CHANNEL: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/package/weave-cbt/assets dist
          install -m 0755 build/cli/weave build/package/weave-cbt/weave
          install -m 0755 deployment/distribution/linux/install.sh build/package/weave-cbt/install.sh
          cp deployment/compose.yaml build/package/weave-cbt/assets/
          cp -R deployment/nginx deployment/bootstrap build/package/weave-cbt/assets/
          python deployment/distribution/make_manifest.py --channel "$CHANNEL" --image "$CBT_IMAGE" --version "1.0.$GITHUB_RUN_NUMBER" --destination build/package/weave-cbt/assets/release-manifest.json
          build/package/weave-cbt/weave release
          tar -C build/package -czf "dist/weave-cbt-$CHANNEL-linux-amd64.tar.gz" weave-cbt
          test -s "dist/weave-cbt-$CHANNEL-linux-amd64.tar.gz"
          mkdir -p build/smoke
          tar -C build/smoke -xzf "dist/weave-cbt-$CHANNEL-linux-amd64.tar.gz"
          build/smoke/weave-cbt/weave --help
          build/smoke/weave-cbt/weave release
          test -f build/smoke/weave-cbt/assets/release-manifest.json
      - name: Linux graphical desktop package
        if: runner.os == 'Linux'
        shell: bash
        env:
          CBT_IMAGE: ${{ needs.image.outputs.image }}
          CHANNEL: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        run: |
          set -Eeuo pipefail
          bash deployment/packaging/linux/build-deb.sh build/cli/weave build/gui/weave-cbt-desktop "$CHANNEL" "1.0.$GITHUB_RUN_NUMBER" "$CBT_IMAGE" build/debroot
          dpkg-deb --info "dist/weave-cbt-desktop-$CHANNEL-linux-amd64.deb"
      # Nuitka also creates .build/.dist directories in dist/. Ship only
      # the verified executable, never its intermediate working directories.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: manager-${{ runner.os }}
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: manager-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish versioned manager release
    # A merge into master never publishes a customer installer automatically.
    # Select "Run workflow" on master with approve_production=true to promote.
    if: >-
      (github.ref == 'refs/heads/staging' && github.event_name == 'push') ||
      (github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' &&
       inputs.approve_production == true)
    needs: [image, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manager-*
          path: dist
          merge-multiple: true
      - name: Publish release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
          CBT_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          # Exactly two Windows executables, one Linux CLI tar and one native DEB.
          shopt -s nullglob
          windows=(dist/*.exe)
          linux=(dist/*.tar.gz)
          debs=(dist/*.deb)
          if [ "${#windows[@]}" -ne 2 ] || [ "${#linux[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected 2 Windows EXEs, 1 Linux CLI tarball and 1 Linux DEB."
            exit 1
          fi
          for entry in dist/*; do
            if [ ! -f "$entry" ]; then
              echo "::error::Unexpected directory or non-file release artifact: $entry"
              exit 1
            fi
          done
          (cd dist && sha256sum -- *.exe *.tar.gz *.deb > SHA256SUMS)
          if [ "$CHANNEL" = staging ]; then
            TAG="staging-1.0.$GITHUB_RUN_NUMBER"
            PRERELEASE=--prerelease
          else
            TAG="v1.0.$GITHUB_RUN_NUMBER"
            PRERELEASE=
          fi
          if [ "$CHANNEL" = staging ]; then
            NOTES="GUI and CLI from commit $GITHUB_SHA; application image $CBT_IMAGE. Install the desktop package or use the standalone CLI."
          else
            NOTES="GUI and CLI from commit $GITHUB_SHA; pinned application image $CBT_IMAGE."
          fi
          gh release create "$TAG" "${windows[@]}" "${linux[@]}" "${debs[@]}" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WEAVE CBT $TAG" $PRERELEASE --notes "$NOTES"
