name: Backend validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave_cbt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U weave -d weave_cbt_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: dev
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://weave:weave@127.0.0.1:5432/weave_cbt_test
      WEAVE_BOOTSTRAP_TEST_DATABASE_URL: postgresql+asyncpg://weave:weave@127.0.0.1:5432/weave_cbt_test
      REDIS_URL: redis://127.0.0.1:6379/0
      WEAVE_API_BASE_URL: https://example.test
      IDENTITY_STORAGE_PATH: /tmp/weave-cbt/identity
      MEDIA_STORAGE_PATH: /tmp/weave-cbt/media
      BRANDING_LOGO_STORAGE_PATH: /tmp/weave-cbt/branding

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: Initialize and validate database
        run: |
          uv run python -m app.core.database_bootstrap
          uv run python -m app.core.database_bootstrap

      - name: Run backend tests
        run: uv run pytest -q
