name: WEAVE CBT Desktop validation

on:
  pull_request:
    branches: [staging, master]
    paths:
      - 'deployment/gui/**'
      - '.github/workflows/deployment-gui-validation.yml'

permissions:
  contents: read

concurrency:
  group: weave-gui-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Qt Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt shared libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0
      - name: Test CLI detection and local state
        run: python -m unittest discover -s deployment/gui/tests -v
      - name: Install PySide6 and Nuitka
        run: python -m pip install 'PySide6>=6.7,<7' nuitka zstandard
      - name: Smoke-test Qt window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python deployment/gui/main.py --smoke-test
      - name: Compile Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m nuitka --mode=onefile --enable-plugin=pyside6 --assume-yes-for-downloads --include-data-dir=deployment/gui/resources=resources --output-dir=build/gui --output-filename=weave-cbt-desktop deployment/gui/main.py
          QT_QPA_PLATFORM=offscreen build/gui/weave-cbt-desktop --smoke-test
      - name: Compile Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka --mode=onefile --enable-plugin=pyside6 --windows-console-mode=disable --assume-yes-for-downloads --include-data-dir=deployment/gui/resources=resources --output-dir=build/gui --output-filename=WEAVE-CBT-Desktop.exe deployment/gui/main.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI compilation failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & (Resolve-Path build\gui\WEAVE-CBT-Desktop.exe).Path --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Compiled GUI failed smoke test' }
      - name: Compiled Windows GUI-to-CLI integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -e ./deployment
          if ($LASTEXITCODE -ne 0) { throw 'CLI dependencies failed to install' }
          python -m nuitka --mode=onefile --onefile-no-compression --assume-yes-for-downloads --output-dir=build/gui --output-filename=weave.exe deployment/cli/entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw 'CLI compilation failed' }
          New-Item -ItemType Directory -Path build/gui/assets -Force | Out-Null
          Copy-Item deployment/compose.yaml build/gui/assets/compose.yaml
          Copy-Item deployment/nginx build/gui/assets/nginx -Recurse
          Copy-Item deployment/certificates build/gui/assets/certificates -Recurse
          Copy-Item deployment/bootstrap build/gui/assets/bootstrap -Recurse
          $digest = 'ghcr.io/weavecloudspace-repo/weave-cbt-production-repository@sha256:' + ('a' * 64)
          python deployment/distribution/make_manifest.py --channel staging --image $digest --version 0.0.test --destination build/gui/assets/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Test manifest creation failed' }
          & (Resolve-Path build/gui/weave.exe).Path release
          if ($LASTEXITCODE -ne 0) { throw 'Standalone compiled CLI verification failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & (Resolve-Path build/gui/WEAVE-CBT-Desktop.exe).Path --smoke-test-cli
          if ($LASTEXITCODE -ne 0) { throw 'Compiled GUI could not discover and launch compiled CLI' }

