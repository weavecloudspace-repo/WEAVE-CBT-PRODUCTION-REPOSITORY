services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bootstrap:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}
    command: [/app/weave-cbt/weave-cbt, bootstrap]
    # Populate the initially empty Docker volume in one sequential container.
    # This avoids concurrent copy-up of the image's identity/media/branding.
    volumes:
      - weave_data:/var/lib/weave-cbt
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      DEBUG: ${DEBUG:-false}
      WEAVE_API_BASE_URL: ${WEAVE_API_BASE_URL:?WEAVE_API_BASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}
    command: [/app/weave-cbt/weave-cbt, api]
    scale: 3
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      DEBUG: ${DEBUG:-false}
      WEAVE_API_BASE_URL: ${WEAVE_API_BASE_URL:?WEAVE_API_BASE_URL is required}
    volumes:
      - weave_data:/var/lib/weave-cbt
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    image: ${WEAVE_IMAGE:?WEAVE_IMAGE is required}
    command: [/app/weave-cbt/weave-cbt, worker]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      DEBUG: ${DEBUG:-false}
      WEAVE_API_BASE_URL: ${WEAVE_API_BASE_URL:?WEAVE_API_BASE_URL is required}
    volumes:
      - weave_data:/var/lib/weave-cbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  nginx:
    image: nginx:stable-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/reload-watch.sh:/opt/weave/reload-watch.sh:ro
      - tls_certificates:/etc/letsencrypt:ro
      - tls_snippets:/etc/nginx/weave-conf:ro
    command: ["/bin/sh", "/opt/weave/reload-watch.sh"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  certbot-renew:
    image: certbot/certbot:v4.2.0
    profiles: ["tls"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do python3 /opt/weave/hooks.py renew || true; sleep 43200; done"]
    environment:
      WEAVE_API_BASE_URL: ${WEAVE_API_BASE_URL:?WEAVE_API_BASE_URL is required}
    volumes:
      - tls_certificates:/etc/letsencrypt
      - ./certificates/hooks.py:/opt/weave/hooks.py:ro
      - type: volume
        source: weave_data
        target: /var/lib/weave-cbt/identity
        read_only: true
        volume:
          subpath: identity
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v4.2.0
    profiles: ["tls"]
    entrypoint: ["python3", "/opt/weave/hooks.py"]
    command: ["issue"]
    environment:
      WEAVE_API_BASE_URL: ${WEAVE_API_BASE_URL:?WEAVE_API_BASE_URL is required}
    volumes:
      - tls_certificates:/etc/letsencrypt
      - tls_snippets:/var/lib/weave-cbt/tls-snippets
      - ./certificates/hooks.py:/opt/weave/hooks.py:ro
      - type: volume
        source: weave_data
        target: /var/lib/weave-cbt/identity
        read_only: true
        volume:
          subpath: identity
    depends_on:
      api:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  weave_data:
  tls_certificates:
  tls_snippets:
