events {
    worker_connections 4096;
}

http {
    include /etc/nginx/weave-conf/*.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream weave_api {
        zone weave_api 64k;

        # Docker DNS resolves the `api` service to the active API replicas.
        server api:8000 resolve;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # WEAVE permits image uploads larger than Nginx's 1 MB default.
        client_max_body_size 10m;

        location / {
            proxy_pass http://weave_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # If one API replica disappears, retry another replica for
            # connection/transport failures and gateway errors.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
